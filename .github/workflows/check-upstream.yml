# ADDED BY gaofengnan (not in dariogriffo/zig-debian).
# Why: dariogriffo/zig-debian has no scheduled check, so no build starts when a new upstream version appears.
# Griffo starts these builds by hand. This fork serves deb.gaofn.xyz, where every other fork has an
# hourly check-upstream.yml, so this file gives this fork the same routine.
# How: hourly, compare the latest stable upstream version with the version of our latest release
# (tag "<ver>+<build>") and, if they differ and no build is running, dispatch release.yml.
# Safe to delete: the fork then goes back to manual dispatch like his.
# Zig specifics: the version comes from https://ziglang.org/download/index.json (highest x.y.z key,
# "master" excluded). release.yml requires both packages (fail_on_unmatched_files), so the oldstable
# version is passed too: the highest x.y.z of the previous minor series.
name: Check for new zig release

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch: {}

concurrency:
  group: check-upstream
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # required to dispatch release.yml

jobs:
  check:
    name: Compare upstream vs published
    runs-on: ubuntu-latest
    steps:
      - name: Detect and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          up_ver=$(curl -fsSL https://ziglang.org/download/index.json | jq -r \
            'del(.master) | keys | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | sort_by(split(".") | map(tonumber)) | last')
          if [ -z "$up_ver" ] || [ "$up_ver" = "null" ]; then
            echo "Could not read the latest stable zig version; aborting."
            exit 1
          fi
          echo "Upstream stable: ${up_ver}"

          old_ver=$(curl -fsSL https://ziglang.org/download/index.json | jq -r --arg up "$up_ver" \
            'del(.master) | keys | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | map(select((split(".")[1] | tonumber) < ($up | split(".")[1] | tonumber))) | sort_by(split(".") | map(tonumber)) | last')
          if [ -z "$old_ver" ] || [ "$old_ver" = "null" ]; then
            echo "Could not read the oldstable zig version; aborting."
            exit 1
          fi
          echo "Upstream oldstable: ${old_ver}"

          ours=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q .tag_name 2>/dev/null || echo "")
          ours_ver="${ours%%+*}"
          echo "Ours: ${ours:-<none>} -> ${ours_ver:-<none>}"

          if [ "$up_ver" = "$ours_ver" ]; then
            echo "Up to date."
            exit 0
          fi

          active=$(gh run list --workflow=release.yml --json status \
            -q '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [ "$active" -gt 0 ]; then
            echo "A release.yml run is already active ($active); skipping this tick."
            exit 0
          fi

          echo "New release detected: ${ours_ver:-<none>} -> ${up_ver}. Dispatching build."
          gh workflow run release.yml -f zig_stable_version="${up_ver}" -f zig_oldstable_version="${old_ver}" -f build_version=1
